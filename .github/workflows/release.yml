name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-linux:
    name: Linux release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Build Debian package
        run: scripts/package-deb.sh --no-build --output-dir dist

      - name: Copy binary artifact
        run: |
          mkdir -p dist
          cp target/release/mh dist/mh-linux-amd64

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mh-linux-artifacts
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
