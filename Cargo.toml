[package]
name = "mh"
version = "0.1.0"
edition = "2024"
authors = ["Cuma Kurt <cumakurt@gmail.com>"]
repository = "https://github.com/cumakurt/mh"
homepage = "https://github.com/cumakurt/mh"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
crossterm = "0.29"
csv = "1"
dirs = "5"
fuzzy-matcher = "0.3"
hmac = "0.12"
hostname = "0.4"
rand = "0.8"
regex = "1"
ratatui = "0.29"
keyring = "2"
rpassword = "7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
whoami = "1"
libc = "0.2"
tempfile = "3"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
sync = ["dep:reqwest", "dep:base64"]

[[bench]]
name = "record_bench"
harness = false

[[bench]]
name = "record_pipeline_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false
