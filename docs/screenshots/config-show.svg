<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="498" height="2712" role="img">
  <title>mh command output</title>
  <rect width="100%" height="100%" rx="8" fill="#101418"/>
  <rect x="0.5" y="0.5" width="497" height="2711" rx="8" fill="none" stroke="#2f3b45"/>
  <g font-family="JetBrains Mono, Fira Code, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
  <text x="18" y="30" fill="#8fd694">$ mh config show</text>
  <text x="18" y="50" fill="#d8dee9">[history]</text>
  <text x="18" y="70" fill="#d8dee9">max_entries = 100000</text>
  <text x="18" y="90" fill="#d8dee9">ignore_duplicates = true</text>
  <text x="18" y="110" fill="#d8dee9">ignore_space_prefix = true</text>
  <text x="18" y="130" fill="#d8dee9">save_failed_commands = true</text>
  <text x="18" y="150" fill="#d8dee9">save_successful_commands = true</text>
  <text x="18" y="170" fill="#d8dee9">auto_categorize = true</text>
  <text x="18" y="190" fill="#d8dee9">dedupe_window_seconds = 5</text>
  <text x="18" y="210" fill="#d8dee9"></text>
  <text x="18" y="230" fill="#d8dee9">[security]</text>
  <text x="18" y="250" fill="#d8dee9">mask_secrets = true</text>
  <text x="18" y="270" fill="#d8dee9">skip_secret_commands = false</text>
  <text x="18" y="290" fill="#d8dee9">private_mode_env = &quot;MH_PRIVATE&quot;</text>
  <text x="18" y="310" fill="#d8dee9">audit_log = true</text>
  <text x="18" y="330" fill="#d8dee9"></text>
  <text x="18" y="350" fill="#d8dee9">[database]</text>
  <text x="18" y="370" fill="#d8dee9">path = &quot;/tmp/tmp.Tn7ZkhZWWh/data/mh/history.db&quot;</text>
  <text x="18" y="390" fill="#d8dee9">auto_vacuum = true</text>
  <text x="18" y="410" fill="#d8dee9">max_size_mb = 512</text>
  <text x="18" y="430" fill="#d8dee9"></text>
  <text x="18" y="450" fill="#d8dee9">[display]</text>
  <text x="18" y="470" fill="#d8dee9">default_limit = 50</text>
  <text x="18" y="490" fill="#d8dee9">color = true</text>
  <text x="18" y="510" fill="#d8dee9">date_format = &quot;%Y-%m-%d %H:%M:%S&quot;</text>
  <text x="18" y="530" fill="#d8dee9">show_duration = true</text>
  <text x="18" y="550" fill="#d8dee9">show_exit_code = true</text>
  <text x="18" y="570" fill="#d8dee9"></text>
  <text x="18" y="590" fill="#d8dee9">[ignore]</text>
  <text x="18" y="610" fill="#d8dee9">commands = [</text>
  <text x="18" y="630" fill="#d8dee9">    &quot;history&quot;,</text>
  <text x="18" y="650" fill="#d8dee9">    &quot;clear&quot;,</text>
  <text x="18" y="670" fill="#d8dee9">    &quot;exit&quot;,</text>
  <text x="18" y="690" fill="#d8dee9">    &quot;logout&quot;,</text>
  <text x="18" y="710" fill="#d8dee9">    &quot;mh record&quot;,</text>
  <text x="18" y="730" fill="#d8dee9">]</text>
  <text x="18" y="750" fill="#d8dee9">patterns = [</text>
  <text x="18" y="770" fill="#d8dee9">    &quot;.*password.*&quot;,</text>
  <text x="18" y="790" fill="#d8dee9">    &quot;.*token.*&quot;,</text>
  <text x="18" y="810" fill="#d8dee9">    &quot;.*secret.*&quot;,</text>
  <text x="18" y="830" fill="#d8dee9">    &quot;.*api[_-]?key.*&quot;,</text>
  <text x="18" y="850" fill="#d8dee9">    &quot;.*bearer.*&quot;,</text>
  <text x="18" y="870" fill="#d8dee9">]</text>
  <text x="18" y="890" fill="#d8dee9"></text>
  <text x="18" y="910" fill="#d8dee9">[categories]</text>
  <text x="18" y="930" fill="#d8dee9">docker = [</text>
  <text x="18" y="950" fill="#d8dee9">    &quot;docker &quot;,</text>
  <text x="18" y="970" fill="#d8dee9">    &quot;docker-compose &quot;,</text>
  <text x="18" y="990" fill="#d8dee9">    &quot;podman &quot;,</text>
  <text x="18" y="1010" fill="#d8dee9">]</text>
  <text x="18" y="1030" fill="#d8dee9">git = [</text>
  <text x="18" y="1050" fill="#d8dee9">    &quot;git &quot;,</text>
  <text x="18" y="1070" fill="#d8dee9">    &quot;gh &quot;,</text>
  <text x="18" y="1090" fill="#d8dee9">]</text>
  <text x="18" y="1110" fill="#d8dee9">network = [</text>
  <text x="18" y="1130" fill="#d8dee9">    &quot;curl &quot;,</text>
  <text x="18" y="1150" fill="#d8dee9">    &quot;wget &quot;,</text>
  <text x="18" y="1170" fill="#d8dee9">    &quot;ssh &quot;,</text>
  <text x="18" y="1190" fill="#d8dee9">    &quot;nc &quot;,</text>
  <text x="18" y="1210" fill="#d8dee9">    &quot;nmap &quot;,</text>
  <text x="18" y="1230" fill="#d8dee9">    &quot;ping &quot;,</text>
  <text x="18" y="1250" fill="#d8dee9">]</text>
  <text x="18" y="1270" fill="#d8dee9">package = [</text>
  <text x="18" y="1290" fill="#d8dee9">    &quot;apt &quot;,</text>
  <text x="18" y="1310" fill="#d8dee9">    &quot;apt-get &quot;,</text>
  <text x="18" y="1330" fill="#d8dee9">    &quot;dpkg &quot;,</text>
  <text x="18" y="1350" fill="#d8dee9">    &quot;snap &quot;,</text>
  <text x="18" y="1370" fill="#d8dee9">    &quot;cargo &quot;,</text>
  <text x="18" y="1390" fill="#d8dee9">    &quot;pip &quot;,</text>
  <text x="18" y="1410" fill="#d8dee9">]</text>
  <text x="18" y="1430" fill="#d8dee9">system = [</text>
  <text x="18" y="1450" fill="#d8dee9">    &quot;systemctl &quot;,</text>
  <text x="18" y="1470" fill="#d8dee9">    &quot;journalctl &quot;,</text>
  <text x="18" y="1490" fill="#d8dee9">    &quot;top &quot;,</text>
  <text x="18" y="1510" fill="#d8dee9">    &quot;htop &quot;,</text>
  <text x="18" y="1530" fill="#d8dee9">]</text>
  <text x="18" y="1550" fill="#d8dee9"></text>
  <text x="18" y="1570" fill="#d8dee9">[sync]</text>
  <text x="18" y="1590" fill="#d8dee9">enabled = false</text>
  <text x="18" y="1610" fill="#d8dee9">server_url = &quot;&quot;</text>
  <text x="18" y="1630" fill="#d8dee9">token = &quot;&quot;</text>
  <text x="18" y="1650" fill="#d8dee9">auto_sync_interval_minutes = 60</text>
  <text x="18" y="1670" fill="#d8dee9">last_synced_at = &quot;&quot;</text>
  <text x="18" y="1690" fill="#d8dee9">device_id = &quot;57e4cf8f-cdee-40d3-ba4e-0c3110cfe03a&quot;</text>
  <text x="18" y="1710" fill="#d8dee9"></text>
  <text x="18" y="1730" fill="#d8dee9">[vault]</text>
  <text x="18" y="1750" fill="#d8dee9">enabled = false</text>
  <text x="18" y="1770" fill="#d8dee9">use_keyring = true</text>
  <text x="18" y="1790" fill="#d8dee9"></text>
  <text x="18" y="1810" fill="#d8dee9">[policy]</text>
  <text x="18" y="1830" fill="#d8dee9">default_action = &quot;allow&quot;</text>
  <text x="18" y="1850" fill="#d8dee9"></text>
  <text x="18" y="1870" fill="#d8dee9">[[policy.rules]]</text>
  <text x="18" y="1890" fill="#d8dee9">id = &quot;deny-critical-prod&quot;</text>
  <text x="18" y="1910" fill="#d8dee9">action = &quot;deny&quot;</text>
  <text x="18" y="1930" fill="#d8dee9">risk_level = &quot;critical&quot;</text>
  <text x="18" y="1950" fill="#d8dee9">environment = &quot;production&quot;</text>
  <text x="18" y="1970" fill="#d8dee9">message = &quot;Critical commands are blocked in production&quot;</text>
  <text x="18" y="1990" fill="#d8dee9"></text>
  <text x="18" y="2010" fill="#d8dee9">[[policy.rules]]</text>
  <text x="18" y="2030" fill="#d8dee9">id = &quot;approval-critical&quot;</text>
  <text x="18" y="2050" fill="#d8dee9">action = &quot;require_approval&quot;</text>
  <text x="18" y="2070" fill="#d8dee9">risk_level = &quot;critical&quot;</text>
  <text x="18" y="2090" fill="#d8dee9">message = &quot;Critical commands require explicit approval&quot;</text>
  <text x="18" y="2110" fill="#d8dee9"></text>
  <text x="18" y="2130" fill="#d8dee9">[[policy.rules]]</text>
  <text x="18" y="2150" fill="#d8dee9">id = &quot;warn-high&quot;</text>
  <text x="18" y="2170" fill="#d8dee9">action = &quot;warn&quot;</text>
  <text x="18" y="2190" fill="#d8dee9">risk_level = &quot;high&quot;</text>
  <text x="18" y="2210" fill="#d8dee9">message = &quot;High risk command detected&quot;</text>
  <text x="18" y="2230" fill="#d8dee9"></text>
  <text x="18" y="2250" fill="#d8dee9">[retention]</text>
  <text x="18" y="2270" fill="#d8dee9">enabled = false</text>
  <text x="18" y="2290" fill="#d8dee9">retention_days = 365</text>
  <text x="18" y="2310" fill="#d8dee9">respect_legal_hold = true</text>
  <text x="18" y="2330" fill="#d8dee9"></text>
  <text x="18" y="2350" fill="#d8dee9">[[environment.rules]]</text>
  <text x="18" y="2370" fill="#d8dee9">tier = &quot;production&quot;</text>
  <text x="18" y="2390" fill="#d8dee9">hostname_contains = &quot;prod&quot;</text>
  <text x="18" y="2410" fill="#d8dee9"></text>
  <text x="18" y="2430" fill="#d8dee9">[[environment.rules]]</text>
  <text x="18" y="2450" fill="#d8dee9">tier = &quot;staging&quot;</text>
  <text x="18" y="2470" fill="#d8dee9">hostname_contains = &quot;stage&quot;</text>
  <text x="18" y="2490" fill="#d8dee9"></text>
  <text x="18" y="2510" fill="#d8dee9">[[environment.rules]]</text>
  <text x="18" y="2530" fill="#d8dee9">tier = &quot;development&quot;</text>
  <text x="18" y="2550" fill="#d8dee9">hostname_contains = &quot;dev&quot;</text>
  <text x="18" y="2570" fill="#d8dee9"></text>
  <text x="18" y="2590" fill="#d8dee9">[siem]</text>
  <text x="18" y="2610" fill="#d8dee9">enabled = false</text>
  <text x="18" y="2630" fill="#d8dee9">format = &quot;syslog&quot;</text>
  <text x="18" y="2650" fill="#d8dee9"></text>
  <text x="18" y="2670" fill="#d8dee9">[break_glass]</text>
  <text x="18" y="2690" fill="#d8dee9">default_ttl_hours = 4</text>
  </g>
</svg>
