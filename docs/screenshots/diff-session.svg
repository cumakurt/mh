<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="292" role="img">
  <title>mh command output</title>
  <rect width="100%" height="100%" rx="8" fill="#101418"/>
  <rect x="0.5" y="0.5" width="539" height="291" rx="8" fill="none" stroke="#2f3b45"/>
  <g font-family="JetBrains Mono, Fira Code, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
  <text x="18" y="30" fill="#8fd694">$ mh diff --session demo-session-001 --session other-session</text>
  <text x="18" y="50" fill="#d8dee9">session demo-session-001: 6 unique command(s)</text>
  <text x="18" y="70" fill="#d8dee9">session other-session: 0 unique command(s)</text>
  <text x="18" y="90" fill="#d8dee9"></text>
  <text x="18" y="110" fill="#d8dee9">Only in session demo-session-001:</text>
  <text x="18" y="130" fill="#d8dee9">- curl https://example.com</text>
  <text x="18" y="150" fill="#d8dee9">- docker ps -a</text>
  <text x="18" y="170" fill="#d8dee9">- git status</text>
  <text x="18" y="190" fill="#d8dee9">- kubectl get pods</text>
  <text x="18" y="210" fill="#d8dee9">- pytest tests/unit</text>
  <text x="18" y="230" fill="#d8dee9">- rm -rf /tmp/sandbox</text>
  <text x="18" y="250" fill="#d8dee9"></text>
  <text x="18" y="270" fill="#d8dee9">Only in session other-session:</text>
  </g>
</svg>
