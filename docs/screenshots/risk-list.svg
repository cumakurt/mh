  <text x="18" y="150" fill="#d8dee9">│ disk_overwrite        ┆ critical ┆ Direct disk overwrite with dd or similar                │</text>
  <text x="18" y="170" fill="#d8dee9">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</text>
  <text x="18" y="190" fill="#d8dee9">│ filesystem_format     ┆ critical ┆ Filesystem formatting command                           │</text>
  <text x="18" y="210" fill="#d8dee9">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</text>
  <text x="18" y="230" fill="#d8dee9">│ fork_bomb             ┆ critical ┆ Fork bomb or runaway process pattern                    │</text>
  <text x="18" y="250" fill="#d8dee9">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌┼╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</text>
